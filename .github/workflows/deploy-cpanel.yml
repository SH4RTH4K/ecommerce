name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get latest code
        uses: actions/checkout@v6

      - name: Verify FTP settings
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_SERVER_DIR: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
        run: |
          if [ -z "$CPANEL_FTP_SERVER" ] || [ -z "$CPANEL_FTP_USERNAME" ] || [ -z "$CPANEL_FTP_PASSWORD" ] || [ -z "$CPANEL_FTP_SERVER_DIR" ]; then
            echo "Missing FTP secrets. Add CPANEL_FTP_SERVER, CPANEL_FTP_USERNAME, CPANEL_FTP_PASSWORD, and CPANEL_FTP_SERVER_DIR in GitHub."
            exit 1
          fi

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.runtime/**
            **/.phpunit.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/docs/**
            **/*.log
            .env
            .env.*
            vendor.zip
